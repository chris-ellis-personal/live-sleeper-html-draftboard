[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper-draftboard"
version = "1.0.0"
description = "Live, auto-refreshing HTML draft board for Sleeper fantasy football drafts, driven by your own rankings spreadsheet."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "openpyxl>=3.1"]
keywords = ["sleeper", "fantasy-football", "draft", "draft-board", "cheat-sheet"]

[project.optional-dependencies]
fast-matching = ["rapidfuzz>=3.0"]
dev = ["pytest"]

[project.scripts]
sleeper-draftboard = "sleeper_draftboard.cli:main"

[tool.setuptools]
packages = ["sleeper_draftboard"]
